name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Git identity for tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  # macOS and Windows support is in progress: these runs report problems but do not block merges yet.
  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Git identity for tests that commit
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - run: dotnet build -c Release
      - name: Package and smoke test the macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: AMC_RELEASE=0.0.0 AMC_RIDS=osx-arm64 scripts/package.sh && scripts/smoke-release.sh dist/overhive-0.0.0-osx-arm64.tar.gz
        timeout-minutes: 15
      - name: PTY smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cli=src/Amc.Cli/bin/Release/net10.0/agentctl
          d="$HOME/.local/state/agent-mission-control"; mkdir -p "$d" && printf x > "$d/token" && chmod 600 "$d/token"  # no daemon needed
          AMC_Port=1 "$cli" run -- /bin/sh -c 'echo hello-from-pty; tty; exit 3' < /dev/null
          echo "exit=$?"
          AMC_Port=1 "$cli" run -- /bin/echo plain
          echo "exit=$?"
        timeout-minutes: 3
      - name: ConPTY smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = "src/Amc.Cli/bin/Release/net10.0/agentctl.exe"
          $d = Join-Path $env:RUNNER_TEMP "amc-smoke"; New-Item -ItemType Directory -Force $d | Out-Null; Set-Content "$d/token" x  # no daemon needed
          $env:AMC_DataDir = $d; $env:AMC_Port = "1"
          & $cli run -- cmd.exe /d /c "echo hello-from-conpty& exit 3"
          "exit=$LASTEXITCODE"
          & $cli run -- powershell -NoProfile -Command "'console=' + -not [Console]::IsOutputRedirected"
          "exit=$LASTEXITCODE"
          & $cli run -- definitely-not-here-amc
          "exit=$LASTEXITCODE"
          exit 0
        timeout-minutes: 3
      # The README's native Windows steps, as written: publish, start the daemon, reach the API and dashboard.
      - name: Native install smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/Amc.Daemon -c Release -o "$env:LOCALAPPDATA\Overhive\amcd" --nologo -v q
          dotnet publish src/Amc.Cli -c Release -o "$env:LOCALAPPDATA\Overhive\cli" --nologo -v q
          $amcd = Start-Process "$env:LOCALAPPDATA\Overhive\amcd\amcd.exe" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\amcd.out" -RedirectStandardError "$env:RUNNER_TEMP\amcd.err"
          $token = "$env:USERPROFILE\.local\state\agent-mission-control\token"
          try {
            $ok = $false
            foreach ($i in 1..60) {
              if (Test-Path $token) {
                try {
                  $h = Invoke-RestMethod http://127.0.0.1:47821/api/health -Headers @{ 'X-Amc-Token' = (Get-Content $token -Raw).Trim() }
                  "health: $($h.overall) version $($h.version)"; $ok = $true; break
                } catch { }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { Get-Content "$env:RUNNER_TEMP\amcd.out", "$env:RUNNER_TEMP\amcd.err" -ErrorAction SilentlyContinue; throw "daemon did not answer /api/health" }
            "dashboard: HTTP $((Invoke-WebRequest http://127.0.0.1:47821/ -UseBasicParsing).StatusCode)"
            # Informational: the runner has no Claude Code, so its checks fail there; git and curl must be found.
            $doctor = & "$env:LOCALAPPDATA\Overhive\cli\agentctl.exe" doctor
            $doctor; "doctor exit=$LASTEXITCODE"
            if ($doctor -match '^\S+\s+(git|curl)\s+not found') { throw "doctor did not find git or curl on PATH" }
          } finally { Stop-Process -Id $amcd.Id -Force -ErrorAction SilentlyContinue }
          exit 0
        timeout-minutes: 8
      # One step per test area, each with its own limit, so a hang in one area still reports the others.
      - name: Tests by area
        shell: bash
        run: |
          set +e
          for area in Platform Core Claude Cli E2E Git Pipeline Process Terminals Tools Ui; do
            echo "::group::$area"
            if command -v timeout >/dev/null; then t="timeout 360"; elif command -v gtimeout >/dev/null; then t="gtimeout 360"; else t=""; fi
            $t dotnet test -c Release --no-build --filter "FullyQualifiedName~Amc.Tests.$area." \
              --logger "trx;LogFileName=$area.trx" --logger "console;verbosity=normal" --results-directory TestResults \
              --blame-hang-timeout 2m --blame-hang-dump-type none
            rc=$?
            echo "::endgroup::"
            echo "AREA $area exit=$rc"
          done
          exit 0
        timeout-minutes: 45
      - name: Failed tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('TestResults/**/*.trx', recursive=True):
              root = ET.parse(f).getroot()
              c = root.find('.//t:Counters', ns)
              print('total', c.get('total'), 'passed', c.get('passed'), 'failed', c.get('failed'))
              for r in root.iter('{%s}UnitTestResult' % ns['t']):
                  if r.get('outcome') == 'Failed':
                      msg = r.find('.//t:Message', ns)
                      print('FAIL', r.get('testName'), '::', (msg.text or '').strip().splitlines()[0][:220] if msg is not None and msg.text else '')
          PY
