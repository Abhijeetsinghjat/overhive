name: Release

# Push a tag like v0.1.0 to build self-contained Linux archives and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # build provenance (signed by GitHub, free for public repositories)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Git identity for tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: dotnet test -c Release
      - name: Package
        run: AMC_RELEASE="${GITHUB_REF_NAME#v}" AMC_RIDS="linux-x64 linux-arm64" scripts/package.sh
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nVerify a download: `sha256sum --ignore-missing -c SHA256SUMS` and `gh attestation verify <archive> -R %s`\n' "$GITHUB_REPOSITORY" >> notes.md
          test -s notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # While src/Amc.Core/Product.cs says Stage = "beta", releases are published as pre-releases.
        run: |
          pre=(); grep -q 'Stage = "beta"' src/Amc.Core/Product.cs && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "Overhive $GITHUB_REF_NAME" --notes-file notes.md "${pre[@]}"
