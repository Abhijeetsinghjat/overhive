name: Release

# Push a tag like v0.1.0 to build self-contained Linux archives and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Git identity for tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: dotnet test -c Release
      - name: Package
        run: AMC_RELEASE="${GITHUB_REF_NAME#v}" AMC_RIDS="linux-x64 linux-arm64" scripts/package.sh
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "Overhive $GITHUB_REF_NAME" --generate-notes
