name: Bug report
description: Something in Overhive is wrong or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please don't include secrets, tokens or private code. Security problems go to a private report instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Overhive version, description: "From `overhive --version` or the release you installed." }
    validations: { required: true }
  - type: dropdown
    id: tool
    attributes:
      label: AI tool involved
      multiple: true
      options: [Claude Code, Codex CLI, Gemini CLI, GitHub Copilot CLI, Cursor CLI, Grok, Aider, OpenCode, Other / none]
  - type: input
    id: os
    attributes: { label: OS and architecture, placeholder: "Ubuntu 24.04, x64" }
  - type: textarea
    id: doctor
    attributes: { label: Output of `overhive doctor`, render: text }
